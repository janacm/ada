<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Finished</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: #0a0a0f;
    color: #e4e4e7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: pointer;
  }

  body {
    background: radial-gradient(ellipse at 50% 40%, rgba(99, 102, 241, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 60%, rgba(168, 85, 247, 0.04) 0%, transparent 50%),
                #0a0a0f;
  }

  .container {
    text-align: center;
    padding: 2rem;
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.96); }
    to   { opacity: 1; transform: scale(1); }
  }

  .icon {
    font-size: 6rem;
    line-height: 1;
    margin-bottom: 1.5rem;
    display: block;
    animation: pulse-glow 2s ease-in-out infinite;
  }

  @keyframes pulse-glow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.3)); }
    50%      { filter: drop-shadow(0 0 40px rgba(99, 102, 241, 0.7)); }
  }

  .title {
    font-size: 3.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
    background: linear-gradient(135deg, #e4e4e7 0%, #a1a1aa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 1.1rem;
    color: #71717a;
    margin-bottom: 2.5rem;
    font-weight: 400;
  }

  /* A confirmation's second line (what else the choice does), under the subtitle. */
  .confirm-note {
    font-size: 0.9rem;
    color: #71717a;
    margin-top: -1.75rem;
  }

  .confirm-note + .confirm-note { margin-top: 0.5rem; }

  /* A command to run (the pause's resume), inside a note. inline-block, so it
     moves to the next line whole rather than breaking at its space. */
  .confirm-note code,
  .paused-note code {
    display: inline-block;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 0.9em;
    color: #c7d2fe;
  }

  .cmd-box {
    background: rgba(39, 39, 42, 0.8);
    border: 1px solid rgba(63, 63, 70, 0.6);
    border-radius: 12px;
    padding: 1.25rem 2rem;
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    max-width: 90vw;
    margin-bottom: 2rem;
    backdrop-filter: blur(6px);
  }

  .cmd-prompt {
    color: #22c55e;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 1rem;
    font-weight: 500;
  }

  .cmd-text {
    color: #e4e4e7;
    font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
    font-size: 1.3rem;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 50vw;
  }

  .meta {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 1rem;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 500;
    background: rgba(39, 39, 42, 0.8);
    border: 1px solid rgba(63, 63, 70, 0.5);
    color: #d4d4d8;
  }

  .badge svg {
    width: 14px;
    height: 14px;
  }

  .badge.success { border-color: rgba(34, 197, 94, 0.4); color: #4ade80; }
  .badge.failure { border-color: rgba(239, 68, 68, 0.4); color: #f87171; }

  /* Repo badge: indigo accent to match the theme. Hidden by default — note the
     .badge rule sets display:inline-flex, which would beat the [hidden] UA rule,
     so visibility is toggled with a class instead of the hidden attribute. */
  .badge.repo { border-color: rgba(99, 102, 241, 0.4); color: #c7d2fe; display: none; }
  .badge.repo.is-visible { display: inline-flex; }

  .dismiss-hint {
    color: #52525b;
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }

  .dismiss-hint kbd {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    background: rgba(63, 63, 70, 0.4);
    border: 1px solid rgba(82, 82, 91, 0.3);
    font-family: "SF Mono", monospace;
    font-size: 0.8rem;
    color: #a1a1aa;
  }

  /* The bar is a "Snooze" toggle over a collapsed row of options. display:flex
     would beat the [hidden] UA rule (see .badge.repo), so [hidden] is restated. */
  .snooze {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
  }

  .snooze[hidden] { display: none; }

  .snooze-toggle,
  .pause-toggle {
    appearance: none;
    cursor: pointer;
    font: inherit;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: #a1a1aa;
    font-size: 0.9rem;
    font-weight: 500;
    padding: 0.4rem 0.95rem;
    border-radius: 999px;
    background: rgba(39, 39, 42, 0.6);
    border: 1px solid rgba(63, 63, 70, 0.6);
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .snooze-toggle:hover,
  .snooze.is-open .snooze-toggle {
    color: #c7d2fe;
    border-color: rgba(99, 102, 241, 0.45);
    background: rgba(99, 102, 241, 0.1);
  }

  .snooze-toggle svg,
  .pause-toggle svg { width: 15px; height: 15px; }
  .snooze-toggle .snooze-chevron,
  .pause-toggle .pause-chevron { width: 13px; height: 13px; transition: transform 0.15s ease; }
  .snooze.is-open .snooze-chevron,
  .pause-toggle[aria-expanded="true"] .pause-chevron { transform: rotate(180deg); }

  /* The pause toggle stays in the grey of the row it sits in. */
  .pause-toggle:hover,
  .pause-toggle[aria-expanded="true"] {
    color: #e4e4e7;
    background: rgba(63, 63, 70, 0.5);
    border-color: rgba(113, 113, 122, 0.8);
  }

  .snooze-options {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .snooze.is-open .snooze-options {
    display: flex;
    animation: snooze-reveal 0.15s ease-out;
  }

  /* The pause durations: their own row under the grey one, opened by the pause
     toggle with a class, like the snooze row. */
  .pause-options {
    display: none;
    margin-top: 0.9rem;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .pause-options.is-open {
    display: flex;
    animation: snooze-reveal 0.15s ease-out;
  }

  @keyframes snooze-reveal {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Pin: a quieter pill after a divider, so it reads as a setting on the row
     rather than one more duration. */
  .snooze-pin {
    appearance: none;
    cursor: pointer;
    font: inherit;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-left: 0.4rem;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    color: #71717a;
    background: transparent;
    border: 1px dashed rgba(82, 82, 91, 0.7);
    position: relative;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }

  .snooze-pin::before {
    content: "";
    position: absolute;
    left: -0.75rem;
    top: 20%;
    height: 60%;
    border-left: 1px solid rgba(63, 63, 70, 0.8);
  }

  .snooze-pin svg { width: 13px; height: 13px; }
  .snooze-pin:hover { color: #d4d4d8; border-color: rgba(113, 113, 122, 0.9); }

  .snooze-pin[aria-pressed="true"] {
    color: #c7d2fe;
    border-style: solid;
    border-color: rgba(99, 102, 241, 0.45);
    background: rgba(99, 102, 241, 0.1);
  }

  .snooze-toggle:focus-visible,
  .snooze-pin:focus-visible,
  .snooze-btn:focus-visible,
  .pause-toggle:focus-visible,
  .pause-btn:focus-visible,
  .summary-row:focus-visible {
    outline: 2px solid rgba(129, 140, 248, 0.8);
    outline-offset: 2px;
  }

  .snooze-btn,
  .pause-btn {
    appearance: none;
    cursor: pointer;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    color: #c7d2fe;
    padding: 0.45rem 1.05rem;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.35);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }

  .snooze-btn:hover {
    background: rgba(99, 102, 241, 0.22);
    border-color: rgba(129, 140, 248, 0.7);
  }

  .snooze-btn:active,
  .pause-btn:active { transform: scale(0.95); }

  /* Custom-duration field: hidden until the "Custom" pill is clicked. Note the
     base rule sets display:none so the [hidden]-vs-display pitfall (see .badge.repo)
     can't apply — visibility is toggled with the .is-open class instead. */
  .snooze-custom,
  .pause-custom {
    display: none;
    align-items: center;
    gap: 0.4rem;
  }

  .snooze-custom.is-open,
  .pause-custom.is-open { display: inline-flex; }

  .snooze-custom-input,
  .pause-custom-input {
    appearance: none;
    -webkit-appearance: none;
    width: 5rem;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    color: #e4e4e7;
    text-align: center;
    padding: 0.45rem 0.9rem;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.35);
    cursor: text;
    user-select: text;
    -webkit-user-select: text;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .snooze-custom-input::placeholder,
  .pause-custom-input::placeholder { color: #71717a; font-weight: 500; }
  .snooze-custom-input:focus { border-color: rgba(129, 140, 248, 0.8); }

  .pause-custom-input {
    background: rgba(63, 63, 70, 0.25);
    border-color: rgba(82, 82, 91, 0.5);
  }

  .pause-custom-input:focus { border-color: rgba(161, 161, 170, 0.8); }

  .snooze-custom-input.invalid,
  .pause-custom-input.invalid {
    border-color: rgba(239, 68, 68, 0.7);
    animation: snooze-shake 0.3s ease;
  }

  /* Strip the number-input spinners so it reads as a pill, not a form field. */
  .snooze-custom-input::-webkit-inner-spin-button,
  .snooze-custom-input::-webkit-outer-spin-button,
  .pause-custom-input::-webkit-inner-spin-button,
  .pause-custom-input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  /* "Mute this conversation" and "Pause all alerts": their own row under the
     snooze bar, quieter grey pills than the snooze ones. Shown with a class for
     the same reason as .badge.repo: a display rule would beat the [hidden] UA
     rule. The pause pills share the mute pill's grey. */
  .mute {
    margin-top: 1rem;
    display: none;
    justify-content: center;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
  }

  .mute.is-visible { display: flex; }

  .snooze-btn.mute-btn,
  .pause-btn {
    color: #a1a1aa;
    background: rgba(63, 63, 70, 0.25);
    border-color: rgba(82, 82, 91, 0.5);
  }

  .snooze-btn.mute-btn:hover,
  .pause-btn:hover {
    color: #e4e4e7;
    background: rgba(63, 63, 70, 0.5);
    border-color: rgba(113, 113, 122, 0.8);
  }

  /* A test alert shown during a pause says so above the hint. Selectable, so
     the resume command can be copied; clicks on it don't dismiss. */
  .paused-note {
    max-width: min(48rem, 90vw);
    margin: -1rem auto 1.25rem;
    font-size: 0.85rem;
    line-height: 1.5;
    color: #a1a1aa;
    cursor: text;
    user-select: text;
    -webkit-user-select: text;
  }

  /* The summary of a pause: a scrolling list where the command box sits on a
     normal alert, in the same zinc panel. */
  .summary-list {
    width: min(44rem, 90vw);
    max-height: min(40vh, 22rem);
    overflow-y: auto;
    margin: 0 auto 2rem;
    padding: 0.35rem;
    text-align: left;
    background: rgba(39, 39, 42, 0.8);
    border: 1px solid rgba(63, 63, 70, 0.6);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    cursor: default;
  }

  .summary-row {
    appearance: none;
    font: inherit;
    color: inherit;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.55rem 0.75rem;
    border: 0;
    border-radius: 8px;
    background: transparent;
    text-align: left;
  }

  button.summary-row { cursor: pointer; }
  button.summary-row:hover { background: rgba(99, 102, 241, 0.12); }

  .summary-time {
    flex: none;
    min-width: 4.75rem;
    white-space: nowrap;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
    color: #71717a;
  }

  .summary-mark {
    flex: none;
    width: 1.4rem;
    height: 1.4rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 700;
    border: 1px solid transparent;
  }

  .status-ask .summary-mark { color: #c7d2fe; background: rgba(99, 102, 241, 0.18); border-color: rgba(99, 102, 241, 0.45); }
  .status-fail .summary-mark { color: #f87171; background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.4); }
  .status-ok .summary-mark { color: #4ade80; background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.35); }

  .summary-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  .summary-label {
    font-size: 0.95rem;
    font-weight: 500;
    color: #e4e4e7;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .summary-meta { font-size: 0.8rem; color: #71717a; }

  .summary-tag {
    flex: none;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    border: 1px solid rgba(82, 82, 91, 0.6);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #a1a1aa;
  }

  .summary-open { flex: none; width: 14px; height: 14px; color: #52525b; }
  button.summary-row:hover .summary-open,
  button.summary-row:focus-visible .summary-open { color: #c7d2fe; }

  .summary-more {
    padding: 0.55rem 0.75rem;
    font-size: 0.85rem;
    color: #71717a;
  }

  @keyframes snooze-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* Feedback note tucked into the corner. cursor:default so it doesn't read as
     part of the click-anywhere-to-dismiss surface; the link gets its own pointer.
     Clicks inside are kept off the global dismiss handler in JS. */
  .feedback {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    max-width: 22rem;
    text-align: left;
    padding: 0.85rem 1.05rem;
    border-radius: 12px;
    background: rgba(39, 39, 42, 0.45);
    border: 1px solid rgba(63, 63, 70, 0.4);
    backdrop-filter: blur(6px);
    cursor: default;
    z-index: 11;
  }

  .feedback-title {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #a1a1aa;
    margin-bottom: 0.35rem;
  }

  .feedback-text {
    font-size: 0.82rem;
    line-height: 1.5;
    color: #71717a;
  }

  .feedback-link {
    color: #c7d2fe;
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 1px solid rgba(99, 102, 241, 0.4);
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .feedback-link:hover {
    color: #e0e7ff;
    border-bottom-color: rgba(129, 140, 248, 0.8);
  }

  .progress-ring {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 3px;
    background: linear-gradient(90deg, rgba(99, 102, 241, 0.5), rgba(168, 85, 247, 0.5));
    transition: width 1s linear;
    width: 100%;
    z-index: 10;
  }

  @media (prefers-reduced-motion: reduce) {
    .icon { animation: none; }
    .container { animation: none; }
    .snooze-custom-input.invalid,
    .pause-custom-input.invalid { animation: none; }
    .snooze.is-open .snooze-options,
    .pause-options.is-open { animation: none; }
    .snooze-chevron,
    .pause-chevron { transition: none; }
  }
</style>
</head>
<body>

<div class="container" id="app">
  <span class="icon" id="statusIcon">⚡</span>
  <p class="title">Command Finished</p>
  <p class="subtitle">The terminal is ready for you</p>

  <div class="cmd-box">
    <span class="cmd-prompt">$</span>
    <span class="cmd-text" id="cmdDisplay">—</span>
  </div>

  <div class="meta">
    <span class="badge repo" id="repoBadge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
      <span id="repoDisplay"></span>
    </span>
    <span class="badge" id="durationBadge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span id="durationDisplay">—</span>
    </span>
    <span class="badge success" id="exitBadge">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <span id="exitDisplay">—</span>
    </span>
  </div>

  <p class="dismiss-hint" id="dismissHint">Click anywhere or press <kbd>Esc</kbd> to dismiss</p>

  <div class="snooze" id="snoozeBar" hidden>
    <button type="button" class="snooze-toggle" id="snoozeToggle" aria-expanded="false" aria-controls="snoozeOptions">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l2.5 2.5"/><circle cx="12" cy="13" r="8"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/></svg>
      <span id="snoozeLabel">Snooze this alert</span>
      <svg class="snooze-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="snooze-options" id="snoozeOptions">
      <button type="button" class="snooze-pin" id="snoozePin" aria-pressed="false" title="Show these options on every alert">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"/></svg>
        <span id="snoozePinLabel">Pin open</span>
      </button>
    </div>
  </div>

  <div class="mute" id="muteBar"></div>
  <div class="pause-options" id="pauseOptions"></div>
</div>

<!-- "Pause all alerts", cloned into #muteBar when the launcher offers it. -->
<template id="pauseToggleTemplate">
  <button type="button" class="pause-toggle" id="pauseToggle" aria-expanded="false" aria-controls="pauseOptions"
          title="Silence every alert from every session until the time you pick. What arrives meanwhile is shown in one summary when the pause ends.">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    <span>Pause all alerts</span>
    <svg class="pause-chevron" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </button>
</template>

<!-- A summary row that can open its alert's target ends in this arrow. -->
<template id="summaryOpenTemplate">
  <svg class="summary-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
</template>

<div class="feedback" id="feedbackBox">
  <p class="feedback-title">Feedback</p>
  <p class="feedback-text">Want to support us, want us to support a different agent, or the pop-up didn't fire the right way? <a class="feedback-link" id="feedbackLink" href="https://github.com/janacm/ada/issues/new">Let us know.</a></p>
</div>

<div class="progress-ring" id="progressBar"></div>

<script>
  const params = new URLSearchParams(location.search);
  // mode=summary: what arrived while alerts were paused, in one window (see
  // renderSummary below), with no snooze, mute or pause controls.
  const summaryMode = params.get('mode') === 'summary';

  function decodeBase64Url(value) {
    if (!value) return null;
    try {
      const normalized = value.replace(/-/g, '+').replace(/_/g, '/');
      const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
      const bytes = Uint8Array.from(atob(padded), c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    } catch (e) {
      return null;
    }
  }

  function textParam(encodedName, legacyName) {
    const encoded = decodeBase64Url(params.get(encodedName));
    if (encoded !== null) return encoded;

    const value = params.get(legacyName);
    if (value === null) return '';

    // WKWebView loadFileURL can re-escape percent-encoded file:// query values.
    // Decode one extra layer for older launcher URLs that do not include base64.
    if (window.adaNative && /%[0-9a-f]{2}/i.test(value)) {
      try {
        return decodeURIComponent(value);
      } catch (e) {}
    }
    return value;
  }

  const cmd = textParam('cmdb64', 'cmd') || '—';
  const duration = params.get('duration') || '—';
  // A summary is no one command's result: no exit status, and its title never
  // turns red.
  const code = summaryMode ? null : params.get('code');

  document.getElementById('cmdDisplay').textContent = cmd;
  document.getElementById('durationDisplay').textContent = duration;

  // Repo name (git toplevel basename, resolved by the launcher). Absent/empty
  // when the command didn't run inside a git repo — leave the badge hidden then.
  const repo = textParam('repob64', 'repo');
  if (repo) {
    document.getElementById('repoDisplay').textContent = repo;
    document.getElementById('repoBadge').classList.add('is-visible');
  }

  // The session's noun (conversation, session, agent, terminal), shared by the
  // mute button and a session-wide snooze. The launcher only sends
  // snoozescope=session when it named a hold for this session, so the page never
  // claims more than the snooze will do.
  const sessionKind = textParam('mutekindb64', 'mutekind') || 'session';
  const snoozeHoldsSession = params.get('snoozescope') === 'session';

  if (!summaryMode && params.get('snoozed') === '1') {
    document.querySelector('.subtitle').textContent = snoozeHoldsSession
      ? 'Snooze over · this ' + sessionKind + ' can alert again'
      : 'Snoozed reminder · the terminal is ready for you';
  }

  const exitBadge = document.getElementById('exitBadge');
  const exitDisplay = document.getElementById('exitDisplay');
  const statusIcon = document.getElementById('statusIcon');

  if (code === '0') {
    exitDisplay.textContent = 'Exit 0';
    exitBadge.className = 'badge success';
    exitBadge.title = 'Command succeeded';
  } else if (code !== null) {
    exitDisplay.textContent = 'Exit ' + code;
    exitBadge.className = 'badge failure';
    exitBadge.title = 'Command failed';
    statusIcon.textContent = '✕';
    document.querySelector('.title').textContent = 'Command Failed';
    document.querySelector('.title').style.background = 'linear-gradient(135deg, #f87171 0%, #ef4444 100%)';
    document.querySelector('.title').style.webkitBackgroundClip = 'text';
    document.querySelector('.title').style.webkitTextFillColor = 'transparent';
  }

  // Snooze/focus talks to the detached daemon ada-show-alert.sh spawned for us.
  // It's a no-cors fetch so the opaque file:// origin can reach loopback; we
  // never read the (opaque) response, we only need the request to land. keepalive
  // lets it complete even as the window closes a beat later.
  const sport = params.get('sport');
  const stoken = params.get('stoken');
  const daemonEnabled = Boolean(sport && stoken);
  const snoozeEnabled = !summaryMode && params.get('snooze') === '1' && daemonEnabled;
  const focusEnabled = !summaryMode && params.get('focus') === '1' && daemonEnabled;
  const muteEnabled = !summaryMode && params.get('mute') === '1' && daemonEnabled;
  // A test alert shown during a pause carries pauseduntil (0 = until resumed):
  // it says the pause is on instead of offering another one.
  const pausedUntil = summaryMode ? null : params.get('pauseduntil');
  const pauseEnabled = !summaryMode && pausedUntil === null && params.get('pause') === '1' && daemonEnabled;
  // The command that ends a pause on this install, worked out by the launcher.
  const pauseResume = decodeBase64Url(params.get('pauseresumeb64')) || '';

  const hint = document.getElementById('dismissHint');
  // "<lead> or press Esc to dismiss", with the key in a <kbd>.
  function setHint(lead) {
    hint.textContent = lead + ' or press ';
    const kbd = document.createElement('kbd');
    kbd.textContent = 'Esc';
    hint.appendChild(kbd);
    hint.appendChild(document.createTextNode(' to dismiss'));
  }

  if (focusEnabled) {
    const focusName = textParam('focusnameb64', 'focusname');
    setHint('Click anywhere to return' + (focusName ? ' to ' + focusName : ''));
  }

  // A new element with its class and text (set with textContent), appended to
  // parent.
  function addEl(parent, tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text) el.textContent = text;
    parent.appendChild(el);
    return el;
  }

  function signal(path) {
    if (!daemonEnabled) return;
    try {
      if (window.webkit?.messageHandlers?.adaSignal) {
        window.webkit.messageHandlers.adaSignal.postMessage(path);
        return;
      }
    } catch (e) {}
    try {
      fetch(`http://127.0.0.1:${sport}/${stoken}/${path}`, {
        method: 'GET', mode: 'no-cors', keepalive: true,
      }).catch(() => {});
    } catch (e) {}
  }

  let dismissed = false;
  let decided = false; // a snooze was chosen — don't also fire a dismiss
  function closeWindow() {
    // The native helper replaces window.close() with a WebKit message bridge.
    // Never navigate to dismiss: window.open('','_self') blanks the page to about:blank.
    window.close();
    // Fallback if the OS denies the close: drop to the background so the terminal
    // regains focus, instead of leaving a stuck window on screen.
    setTimeout(() => { window.blur?.(); }, 150);
  }

  function dismiss(action = 'dismiss') {
    if (dismissed) return;
    // A confirmation is showing: the daemon already has its decision, so a click
    // or Esc just closes the window sooner.
    if (decided) { dismissed = true; closeWindow(); return; }
    dismissed = true;
    signal(action); // let the daemon exit promptly instead of waiting out its deadline
    closeWindow();
  }

  // "2:30 PM", "2:30 PM tomorrow", "2:30 PM yesterday", "2:30 PM Saturday"
  // within a week either way, else "2:30 PM on Oct 2". A snooze is at most 1440
  // minutes, but across a daylight-saving change that can still land two
  // calendar days out, so the days are counted rather than assumed. A pause
  // can last longer, and a summary names a time in the past.
  function clockAt(ms) {
    const at = new Date(ms);
    const time = at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const now = new Date();
    const days = Math.round((new Date(at.getFullYear(), at.getMonth(), at.getDate()) -
      new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 86400000);
    if (days === 0) return time;
    if (days === 1) return time + ' tomorrow';
    if (days === -1) return time + ' yesterday';
    if (Math.abs(days) < 7) return time + ' ' + at.toLocaleDateString([], { weekday: 'long' });
    return time + ' on ' + at.toLocaleDateString([], {
      month: 'short', day: 'numeric',
      year: at.getFullYear() === now.getFullYear() ? undefined : 'numeric',
    });
  }

  function clockIn(mins) {
    return clockAt(Date.now() + mins * 60000);
  }

  // How long a confirmation stays up: long enough to read two lines, and the
  // pause's resume command too. A click or Esc closes it sooner.
  const CONFIRM_MS = 1200;
  const PAUSE_CONFIRM_MS = 2000;

  // Replace the alert with a short confirmation. notes is one line or a list
  // of them under the subtitle; a line given as { text, code } shows code in
  // monospace after text. Text goes in with textContent, since the session noun
  // and the resume command come from the URL.
  function confirmScreen(icon, title, subtitle, notes, holdMs = CONFIRM_MS) {
    const app = document.getElementById('app');
    app.textContent = '';
    addEl(app, 'span', 'icon', icon);
    addEl(app, 'p', 'title', title);
    addEl(app, 'p', 'subtitle', subtitle);
    for (const line of Array.isArray(notes) ? notes : [notes]) {
      if (!line) continue;
      if (typeof line === 'string') { addEl(app, 'p', 'confirm-note', line); continue; }
      addEl(addEl(app, 'p', 'confirm-note', line.text), 'code', '', line.code);
    }
    setTimeout(closeWindow, holdMs);
  }

  function snooze(mins) {
    if (decided || dismissed) return;
    decided = true;
    signal(`snooze/${mins}`);
    if (snoozeHoldsSession) {
      // Only the Claude/Codex hook lifts the hold when you type, and it is the
      // one integration whose noun is "conversation".
      confirmScreen('⏰', 'Snoozed', 'This ' + sessionKind + ' is quiet until ' + clockIn(mins),
        sessionKind === 'conversation' ? 'Send it a message to end the snooze early' : '');
    } else {
      confirmScreen('⏰', 'Snoozed', 'This alert comes back at ' + clockIn(mins),
        'Other alerts still come through');
    }
  }

  // Silence this session for good (until the mute expires or `ada-mute clear`).
  // The daemon writes the marker; the launcher drops every later alert with the
  // same session key, a pending snooze relaunch included.
  function mute(kind) {
    if (decided || dismissed) return;
    decided = true;
    signal('mute');
    confirmScreen('🔕', 'Muted', 'No more alerts from this ' + kind, '');
  }

  // Pause every alert, from every session. The daemon runs ada-pause.sh, which
  // also starts the timer that shows the summary when the pause ends; if that
  // run fails, the daemon raises an alert of its own, since this page has
  // already said "Paused".
  function pause(mins) {
    if (decided || dismissed) return;
    decided = true;
    signal(`pause/${mins}`);
    confirmScreen('⏸️', 'Paused', 'All alerts are paused until ' + clockIn(mins), [
      'What arrives meanwhile is shown in one summary when the pause ends',
      pauseResume && { text: 'Resume early: ', code: pauseResume },
    ], PAUSE_CONFIRM_MS);
  }

  // Delays the launcher passed, in minutes. The daemon ignores a delay outside
  // 1..1440, so such a preset would only confirm a snooze or a pause that never
  // happens.
  function durations(name) {
    return (params.get(name) || '5,10,30,60')
      .split(',').map(n => parseInt(n, 10)).filter(n => Number.isFinite(n) && n > 0 && n <= 1440);
  }

  // One row of delay pills: a pill per preset, then "Custom", a pill that
  // reveals a minutes input only once clicked. Snooze and pause each build one,
  // with their own class names, so a page-wide locator for one row never
  // matches the other (Playwright's strict mode). Returns cancelCustom, which
  // closes the input when the row folds.
  function buildDurationRow({ container, before = null, mins, btnClass, wrapClass, inputClass,
                              inputLabel, presetLabel, onPick }) {
    function pill(text, onClick) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = btnClass;
      btn.textContent = text;
      btn.addEventListener('click', (e) => { e.stopPropagation(); onClick(); });
      return btn;
    }
    for (const m of mins) {
      const btn = pill(m + 'm', () => onPick(m));
      if (presetLabel) btn.setAttribute('aria-label', presetLabel(m));
      container.insertBefore(btn, before);
    }

    // The daemon accepts 1..1440 minutes (see ada-snooze-daemon.py), so mirror
    // that range here and reject anything outside it.
    const customBtn = pill('Custom', openCustom);

    const customWrap = document.createElement('span');
    customWrap.className = wrapClass;

    const customInput = document.createElement('input');
    customInput.type = 'number';
    customInput.min = '1';
    customInput.max = '1440';
    customInput.inputMode = 'numeric';
    customInput.className = inputClass;
    customInput.placeholder = 'min';
    customInput.setAttribute('aria-label', inputLabel);

    const customSet = pill('Set', submitCustom);

    function openCustom() {
      customBtn.style.display = 'none';
      customWrap.classList.add('is-open');
      customInput.value = '';
      customInput.focus();
    }
    function cancelCustom() {
      customWrap.classList.remove('is-open');
      customInput.classList.remove('invalid');
      customBtn.style.display = '';
    }
    function submitCustom() {
      const v = parseInt(customInput.value, 10);
      if (Number.isFinite(v) && v > 0 && v <= 1440) { onPick(v); return; }
      // Out of range / empty: flash the field, keep it open for another try.
      customInput.classList.remove('invalid');
      void customInput.offsetWidth; // restart the shake animation
      customInput.classList.add('invalid');
      customInput.focus();
      customInput.select();
    }

    customInput.addEventListener('keydown', (e) => {
      // Keep keystrokes off the global Esc-to-dismiss handler while typing.
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); submitCustom(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancelCustom(); }
    });

    customWrap.appendChild(customInput);
    customWrap.appendChild(customSet);
    container.insertBefore(customBtn, before);
    container.insertBefore(customWrap, before);
    return cancelCustom;
  }

  // Snooze and pause each unfold a row of delays, one at a time, so the page is
  // never taller than a pinned snooze row plus the grey row. Folding the snooze
  // row this way is for this alert only: the pin is left alone.
  const unfolding = [];
  function foldOthers(keep) {
    for (const row of unfolding) if (row !== keep) row.setOpen(false);
  }

  const muteBar = document.getElementById('muteBar');
  if (muteEnabled) {
    const kind = sessionKind;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'snooze-btn mute-btn';
    btn.id = 'muteBtn';
    btn.textContent = '🔕 Mute this ' + kind;
    btn.addEventListener('click', (e) => { e.stopPropagation(); mute(kind); });
    muteBar.appendChild(btn);
  }

  // "Pause all alerts", beside the mute pill. Its delays are the snooze ones
  // (the launcher sends 5 10 30 60 when snooze is off), and it has no pin: the
  // row always starts folded.
  if (pauseEnabled) {
    const toggle = document.getElementById('pauseToggleTemplate').content.firstElementChild.cloneNode(true);
    const options = document.getElementById('pauseOptions');
    const row = {
      setOpen(open) {
        options.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        if (!open) cancelCustom();
      },
    };
    const cancelCustom = buildDurationRow({
      container: options,
      mins: durations('pausemins'),
      btnClass: 'pause-btn',
      wrapClass: 'pause-custom',
      inputClass: 'pause-custom-input',
      inputLabel: 'Custom pause minutes',
      presetLabel: (m) => 'Pause all alerts for ' + m + (m === 1 ? ' minute' : ' minutes'),
      onPick: pause,
    });
    unfolding.push(row);
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = toggle.getAttribute('aria-expanded') !== 'true';
      if (open) foldOthers(row);
      row.setOpen(open);
    });
    options.addEventListener('click', (e) => e.stopPropagation());
    muteBar.appendChild(toggle);
  }

  if (muteEnabled || pauseEnabled) {
    muteBar.addEventListener('click', (e) => e.stopPropagation());
    muteBar.classList.add('is-visible');
  }

  // A press that began in the selectable paused note or in the summary list is
  // a selection, or a row click let go elsewhere, even when it ends outside:
  // the browser sends that click to the common ancestor, which is no dismiss.
  let pressKept = false;
  document.addEventListener('mousedown', (e) => {
    pressKept = Boolean(e.target.closest && e.target.closest('#pausedNote, #summaryList'));
  }, true);
  document.addEventListener('click', () => {
    if (pressKept) { pressKept = false; return; }
    dismiss(focusEnabled ? 'focus' : 'dismiss');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') dismiss('dismiss');
  });

  // Feedback note. Clicks inside the box must not bubble to the dismiss handler,
  // and the link must open in the real browser rather than navigating the alert's
  // own WebView away. The native helper exposes an adaOpen bridge for that; if it's
  // absent we fall back to window.open (a no-op in the bare WebView, but harmless).
  const feedbackBox = document.getElementById('feedbackBox');
  const feedbackLink = document.getElementById('feedbackLink');
  feedbackBox.addEventListener('click', (e) => e.stopPropagation());
  feedbackLink.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const url = feedbackLink.href;
    try {
      if (window.webkit?.messageHandlers?.adaOpen) {
        window.webkit.messageHandlers.adaOpen.postMessage(url);
        return;
      }
    } catch (e) {}
    try { window.open(url, '_blank'); } catch (e) {}
  });

  // Render the snooze options the launcher passed through (ADA_SNOOZE_MINUTES).
  // The durations sit collapsed behind a "Snooze" toggle unless the user pinned
  // them open. The pin outlives this page: the native helper injects the stored
  // value as window.adaPrefs before this script runs and saves changes posted to
  // its adaSnoozePin handler. Without that bridge the pin lasts for this alert.
  if (snoozeEnabled) {
    const bar = document.getElementById('snoozeBar');
    const toggle = document.getElementById('snoozeToggle');
    const options = document.getElementById('snoozeOptions');
    const pinBtn = document.getElementById('snoozePin');
    const pinLabel = document.getElementById('snoozePinLabel');
    let pinned = window.adaPrefs?.snoozePinned === true;

    // Say what a snooze covers before anyone picks a delay.
    document.getElementById('snoozeLabel').textContent =
      snoozeHoldsSession ? 'Snooze this ' + sessionKind : 'Snooze this alert';
    toggle.title = snoozeHoldsSession
      ? 'Quiet this ' + sessionKind + ' until the time you pick, then remind me once' +
        (sessionKind === 'conversation' ? '. Sending it a message ends the snooze early.' : '.')
      : 'Show this alert again later. Other alerts keep coming.';

    function setOpen(open) {
      bar.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      if (!open) cancelCustom();
    }
    const row = { setOpen };
    unfolding.push(row);
    function renderPin() {
      pinBtn.setAttribute('aria-pressed', String(pinned));
      pinLabel.textContent = pinned ? 'Pinned open' : 'Pin open';
      pinBtn.title = pinned
        ? 'Unpin: keep these options behind the Snooze button'
        : 'Show these options on every alert';
    }
    function setPinned(next) {
      pinned = next;
      renderPin();
      try { window.webkit?.messageHandlers?.adaSnoozePin?.postMessage(pinned); } catch (e) {}
    }

    const cancelCustom = buildDurationRow({
      container: options,
      before: pinBtn,
      mins: durations('snoozemins'),
      btnClass: 'snooze-btn',
      wrapClass: 'snooze-custom',
      inputClass: 'snooze-custom-input',
      inputLabel: 'Custom snooze minutes',
      onPick: snooze,
    });

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = !bar.classList.contains('is-open');
      if (open) foldOthers(row);
      setOpen(open);
    });
    pinBtn.addEventListener('click', (e) => { e.stopPropagation(); setPinned(!pinned); });

    // Clicks on the bar's empty space shouldn't bubble to the dismiss handler.
    bar.addEventListener('click', (e) => e.stopPropagation());
    renderPin();
    setOpen(pinned);
    bar.hidden = false;
  }

  // A test alert shown during a pause says so above the hint: until when, how
  // many alerts wait, and the command that resumes. It takes the place of the
  // pause toggle (pauseEnabled is false with pauseduntil).
  if (pausedUntil !== null) {
    const until = /^[0-9]{1,11}$/.test(pausedUntil) ? Number(pausedUntil) : null;
    const held = params.get('pauseheld') || '';
    let text = 'All alerts are paused';
    if (until === 0) text += ' until you resume';
    else if (until !== null) text += ' until ' + clockAt(until * 1000);
    if (/^[0-9]{1,9}$/.test(held)) text += Number(held) ? ' · ' + Number(held) + ' held' : ' · none held yet';
    const note = document.createElement('p');
    note.className = 'paused-note';
    note.id = 'pausedNote';
    note.textContent = text + (pauseResume ? '. Resume: ' : '');
    if (pauseResume) addEl(note, 'code', '', pauseResume);
    // Selectable, so the command can be copied: a click here is not a dismiss,
    // nor a drag that starts here and ends outside (see the click handler).
    note.addEventListener('click', (e) => e.stopPropagation());
    hint.parentNode.insertBefore(note, hint);
  }

  // --- the summary of a pause ---------------------------------------------------
  // The launcher's payload (summaryb64; the format is in the header of
  // lib/ada-show-alert.sh) is checked field by field, and a payload that fails
  // any check shows a fallback instead of a half-drawn list. Every string goes
  // in with textContent.
  const STATUS = {
    ask: { mark: '!', name: 'Needs you' },
    fail: { mark: '✕', name: 'Failed' },
    ok: { mark: '✓', name: 'Finished' },
  };
  const isCount = (v) => Number.isInteger(v) && v >= 0;
  const isEpoch = (v) => isCount(v) && v < 1e11;
  const isText = (v) => typeof v === 'string';

  function readSummary() {
    let data = null;
    try { data = JSON.parse(decodeBase64Url(params.get('summaryb64'))); } catch (e) { return null; }
    if (!data || typeof data !== 'object' || data.v !== 1) return null;
    if (!isCount(data.n) || !isEpoch(data.end) || !['ended', 'resumed'].includes(data.why)) return null;
    if (!Array.isArray(data.items) || data.items.length > 50 || data.n < data.items.length) return null;
    const rowOk = (it) => Boolean(it) && typeof it === 'object' && isEpoch(it.t) &&
      [it.l, it.d, it.c, it.r, it.k, it.a].every(isText) &&
      ['ask', 'fail', 'ok'].includes(it.s) && (it.z === 0 || it.z === 1) && (it.o === 0 || it.o === 1);
    if (!data.items.every(rowOk)) return null;
    // The needs-you and failed totals, which like n can exceed the rows sent.
    // Each is no smaller than its own rows, and the two fit in n. A payload
    // without them has its rows counted instead.
    for (const s of ['ask', 'fail']) {
      const rowsOf = data.items.filter((it) => it.s === s).length;
      if (data[s] === undefined) data[s] = rowsOf;
      else if (!isCount(data[s]) || data[s] < rowsOf) return null;
    }
    return data.ask + data.fail <= data.n ? data : null;
  }

  // A row's time: "2:04 PM", with the date in front when it was not today.
  function rowTime(ms) {
    const at = new Date(ms);
    const time = at.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    if (at.toDateString() === new Date().toDateString()) return time;
    return at.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + time;
  }

  function renderSummary() {
    const app = document.getElementById('app');
    const title = document.querySelector('.title');
    const subtitle = document.querySelector('.subtitle');
    const cmdBox = document.querySelector('.cmd-box');
    statusIcon.textContent = '🔔';
    // Their display rules would beat the hidden attribute (see .badge.repo).
    cmdBox.style.display = 'none';
    document.querySelector('.meta').style.display = 'none';

    const data = readSummary();
    if (!data) {
      title.textContent = 'Alerts while you were paused';
      subtitle.textContent = 'The list could not be read';
      return;
    }
    const failed = data.fail;
    const asking = data.ask;
    title.textContent = data.n === 1 ? '1 alert while you were paused' : data.n + ' alerts while you were paused';
    subtitle.textContent = (data.why === 'resumed' ? 'Resumed at ' : 'Pause ended at ') + clockAt(data.end * 1000) +
      (failed ? ' · ' + failed + ' failed' : '') +
      (asking ? ' · ' + asking + (asking === 1 ? ' needs you' : ' need you') : '');

    const list = document.createElement('div');
    list.className = 'summary-list';
    list.id = 'summaryList';
    // Scrolling, or clicking a row that opens nothing, is not a dismiss.
    list.addEventListener('click', (e) => e.stopPropagation());
    let anyOpens = false;
    data.items.forEach((item, i) => {
      // The page sends only the row's index; the daemon opens the target the
      // launcher named for it. Without a daemon a row opens nothing.
      const opens = item.o === 1 && daemonEnabled;
      const row = document.createElement(opens ? 'button' : 'div');
      row.className = 'summary-row status-' + item.s;
      if (opens) {
        anyOpens = true;
        row.type = 'button';
        row.title = item.a ? 'Open in ' + item.a : 'Open where it came from';
        row.addEventListener('click', (e) => { e.stopPropagation(); dismiss('open/' + i); });
      }
      addEl(row, 'span', 'summary-time', rowTime(item.t * 1000));
      const mark = addEl(row, 'span', 'summary-mark', STATUS[item.s].mark);
      mark.setAttribute('role', 'img');
      mark.setAttribute('aria-label', STATUS[item.s].name);
      const body = addEl(row, 'span', 'summary-body', '');
      addEl(body, 'span', 'summary-label', item.l || '—').title = item.l;
      // A permission prompt's duration is the word "permission", not a time.
      const meta = [item.r, item.d === 'permission' ? '' : item.d].filter(Boolean).join(' · ');
      if (meta) addEl(body, 'span', 'summary-meta', meta);
      if (item.z === 1) addEl(row, 'span', 'summary-tag', 'reminder');
      if (opens) row.appendChild(document.getElementById('summaryOpenTemplate').content.firstElementChild.cloneNode(true));
      list.appendChild(row);
    });
    if (data.n > data.items.length) addEl(list, 'div', 'summary-more', 'and ' + (data.n - data.items.length) + ' more');
    app.insertBefore(list, cmdBox);
    if (anyOpens) setHint('Click an alert to open it, click anywhere else');
  }

  if (summaryMode) renderSummary();

  let remaining = parseInt(params.get('autoclose'), 10);
  if (!Number.isFinite(remaining) || remaining <= 0) remaining = 90;
  const total = remaining;
  const progressBar = document.getElementById('progressBar');

  function tick() {
    remaining--;
    if (remaining <= 0) { dismiss('dismiss'); return; }
    progressBar.style.width = (remaining / total * 100) + '%';
    setTimeout(tick, 1000);
  }

  tick();
</script>
</body>
</html>
